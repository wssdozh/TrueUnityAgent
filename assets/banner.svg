<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#111116" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Cube Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="280" rx="16" fill="url(#bg-grad)" />
  <rect width="878" height="278" x="1" y="1" rx="15" fill="none" stroke="#26262e" stroke-width="1.5" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280" />
    <line x1="120" y1="0" x2="120" y2="280" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="280" y1="0" x2="280" y2="280" />
    <line x1="360" y1="0" x2="360" y2="280" />
    <line x1="440" y1="0" x2="440" y2="280" />
    <line x1="520" y1="0" x2="520" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="680" y1="0" x2="680" y2="280" />
    <line x1="760" y1="0" x2="760" y2="280" />
    <line x1="840" y1="0" x2="840" y2="280" />

    <line x1="0" y1="40" x2="880" y2="40" />
    <line x1="0" y1="100" x2="880" y2="100" />
    <line x1="0" y1="160" x2="880" y2="160" />
    <line x1="0" y1="220" x2="880" y2="220" />
  </g>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="150" cy="140" r="70" fill="#0284c7" opacity="0.25" filter="url(#glow)" />

  <!-- 3D Geometric Isometric Monolith / Unity Core Glyph -->
  <g transform="translate(150, 140)">
    <!-- Top Face -->
    <polygon points="0,-48 44,-24 0,0 -44,-24" fill="url(#cube-top)" />
    <!-- Left Face -->
    <polygon points="-44,-24 0,0 0,52 -44,28" fill="url(#cube-left)" />
    <!-- Right Face -->
    <polygon points="0,0 44,-24 44,28 0,52" fill="url(#cube-right)" />

    <!-- Sharp Inner Axis Lines -->
    <line x1="0" y1="0" x2="0" y2="52" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <line x1="0" y1="0" x2="-44" y2="-24" stroke="#7dd3fc" stroke-width="1.5" opacity="0.5" />
    <line x1="0" y1="0" x2="44" y2="-24" stroke="#7dd3fc" stroke-width="1.5" opacity="0.5" />

    <!-- Orbiting Accent Ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" opacity="0.4" />
  </g>

  <!-- Typography & Content -->
  <g transform="translate(250, 0)">
    <!-- Category Badge -->
    <rect x="0" y="52" width="138" height="24" rx="12" fill="#1e1e26" stroke="#333340" stroke-width="1" />
    <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">UNITY 6 · AGENTS</text>

    <!-- Main Title -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      true-unity-agent
    </text>

    <!-- Punchy Tagline -->
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
      Senior AI engineering standards &amp; anti-overengineering rules
    </text>

    <!-- Value Stats Chips -->
    <g transform="translate(0, 186)">
      <g transform="translate(0, 0)">
        <rect width="135" height="30" rx="6" fill="#181820" stroke="#2b2b38" stroke-width="1" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">No Silent Returns</text>
      </g>
      <g transform="translate(145, 0)">
        <rect width="130" height="30" rx="6" fill="#181820" stroke="#2b2b38" stroke-width="1" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Root-Cause Fix</text>
      </g>
      <g transform="translate(285, 0)">
        <rect width="125" height="30" rx="6" fill="#181820" stroke="#2b2b38" stroke-width="1" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Ponytail Ladder</text>
      </g>
      <g transform="translate(420, 0)">
        <rect width="120" height="30" rx="6" fill="#181820" stroke="#2b2b38" stroke-width="1" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">UI 95% Fidelity</text>
      </g>
    </g>
  </g>
</svg>
